{{- $inj := .Values.vaultDbInjector.injector }}
{{- if and $inj.podDisruptionBudget.enabled (gt (int $inj.replicas) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "vault-db-injector.fullname" . }}
  labels:
  {{- include "vault-db-injector.labels" . | nindent 4 }}
spec:
  minAvailable: {{ $inj.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app: vault-db-injector
    {{- include "vault-db-injector.selectorLabels" . | nindent 6 }}
{{- end }}
